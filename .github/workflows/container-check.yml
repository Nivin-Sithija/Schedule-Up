name: Render container check
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build Render application image (native AMD64)
        run: docker build --progress=plain -t schedule-up:ci .
      - name: Run regression suite inside Linux image
        run: docker run --rm --network none -e NODE_ENV=test -e STORE_DRIVER=file -e DURABLE_MODE=local schedule-up:ci npm test
      - name: Verify bundled embedding model without network
        run: docker run --rm --network none schedule-up:ci node scripts/prewarm-embeddings.mjs
